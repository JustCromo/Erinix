[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erinix"
version = "0.1.0"
description = "Host-based IDS for Linux with chain correlation and active response - part of the Nemirix suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
erinix = "erinix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"erinix.web" = ["static/*", "static/fonts/*"]

[tool.setuptools.data-files]
"share/erinix/rules" = ["rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
