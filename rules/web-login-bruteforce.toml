schema = 1

# Password guessing against a login form, followed by a request that works.
[[chain]]
id = "web-login-bruteforce-success"
tag = "Password guessing"
area = "website"
title = "Someone guessed a login password on the website ({remote})"
why = "Many failed logins from one address, then one that worked. The account may now be in the wrong hands."
next = [
  "Reset the password of the account that logged in",
  "Review what that account did after logging in",
  "Add login rate limiting or a CAPTCHA",
  "Block {remote}",
]
description = "Many failed logins from one address, followed by a successful one."
mitre = ["T1110.001"]
window_seconds = 300
link = "remote_ip"
response = "report_only"

[[chain.step]]
id = "repeated-failed-logins"
label = "Many failed website logins"
event = "web.request"
severity = "medium"
count = 8
[chain.step.match]
method = ["POST"]
contains = ["login", "signin", "sign-in", "/api/token"]
status = [400, 401, 403]

[[chain.step]]
id = "login-worked-after-failures"
label = "A website login worked"
event = "web.request"
severity = "critical"
[chain.step.match]
method = ["POST"]
contains = ["login", "signin", "sign-in", "/api/token"]
status = [200, 201, 302, 303]
