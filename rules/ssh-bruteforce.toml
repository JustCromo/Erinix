schema = 1

# Password guessing against SSH followed by a successful login from the
# same remote address.
[[chain]]
id = "ssh-bruteforce-success"
tag = "Password guessing"
area = "logins"
title = "Someone is guessing SSH passwords from {remote}"
why = "Many failed logins in a short time, followed by one that worked, usually mean a password was guessed."
next = [
  "Change the password of the account that was used",
  "Check recent logins with the last command",
  "Block {remote} on your firewall",
  "Prefer SSH keys and turn password login off",
]
description = "Repeated SSH authentication failures from one address followed by a successful login."
mitre = ["T1110.001"]
window_seconds = 300
link = "remote_ip"
response = "interactive"

[[chain.step]]
id = "repeated-failures"
label = "Many failed password attempts"
event = "auth.failure"
severity = "medium"
count = 5
[chain.step.match]
service = ["sshd"]

[[chain.step]]
id = "success-after-failures"
label = "A login worked"
event = "auth.success"
severity = "critical"
[chain.step.match]
service = ["sshd"]
