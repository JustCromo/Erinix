schema = 1

# Single-event indicator: only the standard account tools should ever
# write the password databases.
[[indicator]]
id = "shadow-written-by-unexpected-process"
tag = "Password file change"
area = "this machine"
title = "The password file was changed by an unusual program"
why = "Only the standard account tools should write the password database. Another program doing it can mean someone is adding or changing accounts."
next = [
  "Check which accounts exist and who changed them",
  "Look at what ran on this machine around this time",
  "Reset passwords if anything looks wrong",
]
description = "The password database was modified by a process that is not a standard account tool."
mitre = ["T1003.008"]
event = "file.access"
severity = "high"
response = "interactive"
[indicator.match]
path = ["/etc/shadow", "/etc/gshadow"]
operation = ["write"]
exe_not = [
  "/usr/bin/passwd", "/usr/bin/chpasswd", "/usr/bin/chage",
  "/usr/bin/usermod", "/usr/bin/useradd", "/usr/bin/userdel",
  "/usr/bin/vipw", "/usr/bin/gpasswd", "/usr/bin/groupadd",
  "/usr/bin/groupmod", "/usr/bin/groupdel",
]
