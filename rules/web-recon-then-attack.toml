schema = 1

# Someone probes for pages that do not exist, then sends an attack payload.
[[chain]]
id = "web-recon-then-attack"
tag = "Scanning"
area = "website"
title = "Someone searched the site for hidden pages, then attacked it ({remote})"
why = "Many requests for pages that do not exist usually mean automated scanning. A real attack followed from the same address."
next = [
  "Review the other alerts from {remote}",
  "Block {remote}",
  "Check that admin and backup pages are not exposed",
]
description = "Many requests for missing pages from one address, followed by an injection attempt."
mitre = ["T1595.003", "T1190"]
window_seconds = 300
link = "remote_ip"
response = "report_only"

[[chain.step]]
id = "probing-for-pages"
label = "Searching for hidden pages"
event = "web.request"
severity = "medium"
count = 10
[chain.step.match]
status = [404]
# Browsers and search bots ask for these on every visit; a site without them answers 404. Not a probe.
path_not = ["/favicon.ico", "/robots.txt", "/sitemap.xml", "/apple-touch-icon.png", "/apple-touch-icon-precomposed.png", "/browserconfig.xml", "/ads.txt"]

[[chain.step]]
id = "payload-after-probing"
label = "Sending attack code"
event = "web.request"
severity = "high"
[chain.step.match]
contains = ["union select", "../", "/etc/passwd", "<script", "' or '1'='1", "' or 1=1", "sleep(", "${jndi:"]
