<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Erinix</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/palettes.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main menu">
      <a class="brand" href="#/" aria-label="Erinix home"><img src="/static/logo.svg" alt="" width="40" height="40"><span>Erinix</span></a>
      <nav id="nav">
        <span class="nav-group">Monitoring</span>
        <a href="#/" data-view="home">
          <svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-home"/></svg>
          <span class="lbl">Home</span></a>
        <a href="#/incidents" data-view="incidents">
          <svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-shield"/></svg>
          <span class="lbl">Incidents</span> <span id="nav-count" class="count" hidden></span></a>
        <a href="#/live" data-view="live">
          <svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-pulse"/></svg>
          <span class="lbl">Live</span></a>
        <span class="nav-group">This machine</span>
        <a href="#/system" data-view="system">
          <svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-gear"/></svg>
          <span class="lbl">System</span></a>
      </nav>
      <div class="side-foot">
        <div id="pill" class="pill state-stopped" role="status" aria-live="polite">Connecting…</div>
        <p class="tiny">Erinix · Nemirix suite <span id="version"></span></p>
      </div>
    </aside>
    <div class="content">
      <div id="banner" class="banner" role="note" hidden></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
